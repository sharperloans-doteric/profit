<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<style>
  body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; }
  .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
  input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
  button { padding: 10px 20px; background: #25d366; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .msg-box { background: #1a1919; border: 1px solid #333; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .msg-time { font-size: 11px; color: #888; text-align: right; margin-top: 5px; }
</style>
</head>
<body>

  <div class="input-box">
    <input type="tel" id="phoneInput" placeholder="Enter phone number (e.g., 2547...)">
    <button onclick="loadMessages()">Load</button>
  </div>
  
  <div id="messages">Enter a phone number to view messages.</div>

<script>
const API = "https://message-server-five.vercel.app";

async function loadMessages() {
  const phone = document.getElementById('phoneInput').value.trim();
  const container = document.getElementById('messages');
  if (!phone) return alert("Please enter a phone number");

  container.innerHTML = "Loading...";
  
  try {
    let res = await fetch(`${API}/api/messages/${phone}`);
    let data = await res.json();
    let messages = [];

    if (data.success && data.messages) {
      messages = data.messages;
    } else {
      // Fallback API endpoint
      res = await fetch(`${API}/transactions`);
      let txData = await res.json();
      messages = txData.filter(tx => tx.phone === phone || tx.phone.includes(phone.slice(-9)));
    }

    if (messages.length === 0) {
      container.innerHTML = "No messages found.";
      return;
    }

    container.innerHTML = messages.map(tx => {
      // Use API timestamp or find time in text, fallback to now
      let timeMatch = tx.message.match(/at (\d{1,2}:\d{2} (?:AM|PM))/i);
      let timeStr = timeMatch ? timeMatch[1] : new Date().toLocaleString();
      return `
        <div class="msg-box">
          <div>${tx.message}</div>
          <div class="msg-time">${timeStr}</div>
        </div>`;
    }).join('');
    
  } catch (err) {
    console.error(err);
    container.innerHTML = "Error loading messages.";
  }
}
</script>
</body>
</html>
