
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Access</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { 
            color: #333; 
            margin-bottom: 0.5rem; 
            font-size: 1.15rem; 
            line-height: 1.3; 
        }
        p { 
            color: #666; 
            margin-bottom: 1.2rem; 
        }
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }
        .amount-input {
            font-size: 1.6rem;
            font-weight: bold;
            color: #0070ba;
            text-align: center;
        }
        .currency {
            font-size: 1rem;
            color: #666;
            margin-left: 5px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
        #status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 6px;
            min-height: 75px;
            font-size: 0.95rem;
            line-height: 1.45;
        }
        .success { background: #e6f4ea; color: #28a745; }
        .error { background: #f8d7da; color: #dc3545; }
        .info { background: #e6f0fa; color: #0070ba; }
        .loader {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <h2>Do not refresh the page after entering your M-Pesa PIN.<br>Wait until you are redirected.</h2>
    <p>Please pay to access <strong>option to create new account</strong></p>
   
    <div class="input-group">
        <label for="amount">Amount (KES)</label>
        <input type="text" id="amount" class="amount-input" value="10" maxlength="6" inputmode="decimal">
    </div>

    <div class="input-group">
        <label for="phone">M-Pesa Phone Number</label>
        <input type="text" id="phone" placeholder="0712345678" maxlength="12" inputmode="numeric">
    </div>
   
    <button id="payBtn" onclick="handlePayment()">Pay with M-Pesa</button>
    <div id="status"></div>
</div>

<script>
    const BACKEND_URL = "https://ban-345aggg.vercel.app";
    const BACKEND_FUNDS = "https://funds-mauve.vercel.app/api";
    const MESSAGE_API = "https://message-server-five.vercel.app";
    let pollTimer = null;

    const userData = JSON.parse(localStorage.getItem('mledger_user'));
    if(!userData) {
        window.location.href = "index.html";
    }

    function showStatus(message, type = "info") {
        const div = document.getElementById('status');
        div.className = type;
        div.innerHTML = message;
    }

    function resetButton() {
        const btn = document.getElementById('payBtn');
        btn.disabled = false;
        btn.innerText = "Pay with M-Pesa";
    }

    function formatAmountInput() {
        const amountInput = document.getElementById('amount');
        amountInput.addEventListener('input', function() {
            let value = this.value.replace(/[^0-9.]/g, '');
            const parts = value.split('.');
            if (parts.length > 2) {
                value = parts[0] + '.' + parts.slice(1).join('');
            }
            if (parts.length === 2) {
                value = parts[0] + '.' + parts[1].substring(0, 2);
            }
            this.value = value;
        });
    }

    async function handlePayment() {
        const phone = document.getElementById('phone').value.trim();
        let amount = parseFloat(document.getElementById('amount').value);

        const btn = document.getElementById('payBtn');

        if (!phone || phone.length < 9) {
            showStatus("Please enter a valid phone number", "error");
            return;
        }

        if (!amount || amount < 10) {
            showStatus("Minimum amount is 10 KES", "error");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Sending STK Push...';
        showStatus("STK Push sent.<br>Check your phone and enter M-Pesa PIN.", "info");

        try {
            const res = await fetch(`${BACKEND_URL}/api/stk-push`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({ 
                    amount: amount, 
                    phone_number: phone 
                })
            });

            const data = await res.json();

            if (data.success) {
                startPolling();
            } else {
                showStatus("Failed to start payment", "error");
                resetButton();
            }
        } catch (err) {
            showStatus("Connection error. Is ngrok running?", "error");
            resetButton();
        }
    }

    function startPolling() {
        let attempts = 0;
        const maxAttempts = 50;

        if (pollTimer) clearInterval(pollTimer);

        pollTimer = setInterval(async () => {
            attempts++;

            try {
                const res = await fetch(`${BACKEND_URL}/api/status`, {
                    headers: { "ngrok-skip-browser-warning": "true" }
                });

                const data = await res.json();

                if (data.status === true && data.response) {
                    const code = data.response.ResultCode;

                    if (code === 0) {
                        clearInterval(pollTimer);
                        showStatus("<strong>Payment Successful!</strong><br>Redirecting you now...", "success");
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 1800);
                        return;
                    }
                    else if (code === 1032) {
                        clearInterval(pollTimer);
                        showStatus("Payment was cancelled.<br>Please try again.", "error");
                        resetButton();
                        return;
                    }
                    else {
                        clearInterval(pollTimer);
                        let msg = data.response.ResultDesc || "Payment failed";
                        if (code === 2001) msg = "Wrong M-Pesa PIN entered.";
                        showStatus(`${msg}`, "error");
                        resetButton();
                        return;
                    }
                }

                if (attempts >= maxAttempts) {
                    clearInterval(pollTimer);
                    showStatus("Request timed out.<br>Check your M-Pesa or try again.", "error");
                    resetButton();
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }, 3000);
    }

    window.onload = function() {
        formatAmountInput();
        
        const phoneInput = document.getElementById('phone');
        const amountInput = document.getElementById('amount');

        phoneInput.addEventListener('keypress', (e) => {
            if (e.key === "Enter") handlePayment();
        });

        amountInput.addEventListener('keypress', (e) => {
            if (e.key === "Enter") handlePayment();
        });
    };
</script>
</body>
</html>
