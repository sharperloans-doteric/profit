
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Request</title>
    <meta name="theme-color" content="#000000">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #201f1f;
            border-bottom: 1px solid #333;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4CAF50;
        }

        .page-content {
            flex: 1;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #1a1919;
            color: #fff;
            font-size: 16px;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .balance-display {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }

        .balance-label {
            color: #aaa;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .balance-amount {
            font-size: 2.2rem;
            font-weight: 800;
            color: #4CAF50;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #4CAF50;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #45a049;
        }

        .submit-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .success-message {
            background: #1a3d1a;
            color: #4caf50;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .error-message {
            background: #3d1a1a;
            color: #f44336;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 class="header-title">Withdrawal Request</h1>
    </div>

    <div class="page-content">
        <div id="messageArea"></div>

        <div class="balance-display">
            <p class="balance-label">Available Balance</p>
            <p class="balance-amount" id="balanceAmount">Ksh 0.00</p>
        </div>

        <form id="withdrawForm">
            <div class="form-group">
                <label class="form-label">Withdrawal Amount</label>
                <input type="number" class="form-input" id="amount" placeholder="Enter amount..." min="1" step="0.01"
                    required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Withdrawal Request</button>
        </form>
    </div>

    <script>
        const API = "https://message-server-five.vercel.app";

        let currentUser = null;

        window.onload = () => {
            const userData = localStorage.getItem('mledger_user');
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(userData);
            fetchAndDisplayBalance();
        };

        async function fetchAndDisplayBalance() {
            try {
                const response = await fetch(`https://funds-mauve.vercel.app/api/balance/${currentUser.phone}`);
                const data = await response.json();
                if (data.success !== undefined) {
                    currentUser.balance = data.balance || 0;
                }
                document.getElementById('balanceAmount').innerText = 'Ksh ' + (currentUser.balance || 0).toLocaleString(undefined, { minimumFractionDigits: 2 });
            } catch (err) {
                document.getElementById('balanceAmount').innerText = 'Ksh ' + (currentUser.balance || 0).toLocaleString(undefined, { minimumFractionDigits: 2 });
            }
        }

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const amount = parseFloat(document.getElementById('amount').value);
            const submitBtn = document.getElementById('submitBtn');
            const messageArea = document.getElementById('messageArea');
            const adminPhone = '4444'; 

            if (isNaN(amount) || amount <= 0) {
                messageArea.innerHTML = '<div class="error-message">Please enter a valid amount greater than 0</div>';
                return;
            }

            const balance = currentUser.balance || 0;
            if (amount > balance) {
                messageArea.innerHTML = '<div class="error-message">Withdrawal amount cannot exceed your available balance of Ksh ' + balance.toLocaleString(undefined, { minimumFractionDigits: 2 }) + '</div>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking limits...';
            messageArea.innerHTML = '';

            try {
                // 1. Fetch recent messages to verify the 24-hour rule
                const checkResponse = await fetch(`${API}/api/messages`);
                const allMessages = await checkResponse.json();

                // 2. Filter out messages submitted by the current user within the last 24 hours
                const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);
                
                // Find any matching withdrawal messages
                const recentWithdrawals = allMessages.filter(msg => {
                    const msgTime = new Date(msg.createdAt || msg.date || msg.timestamp).getTime();
                    
                    return (
                        msg.message && 
                        msg.message.includes("Withdrawal Request") &&
                        msg.message.includes(`Registered Number: ${currentUser.phone}`) &&
                        msgTime > twentyFourHoursAgo
                    );
                });

                // 3. Enforce the limit if a match is found
                if (recentWithdrawals.length > 0) {
                    // Sort to get the latest one
                    recentWithdrawals.sort((a, b) => {
                        return new Date(b.createdAt || b.date || b.timestamp).getTime() - new Date(a.createdAt || a.date || a.timestamp).getTime();
                    });

                    const lastWithdrawalTime = new Date(recentWithdrawals[0].createdAt || recentWithdrawals[0].date || recentWithdrawals[0].timestamp).getTime();
                    const nextAllowedTime = lastWithdrawalTime + (24 * 60 * 60 * 1000);
                    const remainingMs = nextAllowedTime - Date.now();

                    const hoursLeft = Math.floor(remainingMs / (1000 * 60 * 60));
                    const minutesLeft = Math.ceil((remainingMs % (1000 * 60 * 60)) / (1000 * 60));

                    messageArea.innerHTML = `<div class="error-message">
                        You can only submit one withdrawal request every 24 hours.<br>
                        Please try again in <strong>${hoursLeft}h ${minutesLeft}m</strong>.
                    </div>`;
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Withdrawal Request';
                    return;
                }

                submitBtn.textContent = 'Submitting...';

                // 4. Submit the request if no recent withdrawals exist
                const withdrawalMessage = `Withdrawal Request\nAmount: Ksh ${amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}\nRegistered Number: ${currentUser.phone}`;

                const response = await fetch(`${API}/api/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: adminPhone,
                        message: withdrawalMessage,
                        type: 'deducted'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageArea.innerHTML = '<div class="success-message">Withdrawal request submitted! Wait for admin approval.</div>';
                    document.getElementById('withdrawForm').reset();
                    await fetchAndDisplayBalance();
                } else {
                    messageArea.innerHTML = '<div class="error-message">' + (data.error || 'Failed to submit withdrawal request') + '</div>';
                }
            } catch (err) {
                console.error('Error:', err);
                messageArea.innerHTML = '<div class="error-message">Network error or connection failed. Please try again.</div>';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit Withdrawal Request';
        });
    </script>
</body>

</html>
