
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<style>
  body { 
    font-family: sans-serif; 
    background: #000; 
    color: #fff; 
    margin: 0; 
    padding: 15px; 
  }
  .input-box { 
    display: flex; 
    gap: 10px; 
    margin-bottom: 20px; 
  }
  input { 
    flex: 1; 
    padding: 10px; 
    border-radius: 5px; 
    border: 1px solid #444; 
    background: #222; 
    color: #fff; 
  }
  button { 
    padding: 10px 20px; 
    background: #25d366; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    font-weight: bold; 
  }
  .msg-box { 
    background: #1a1919; 
    border: 1px solid #333; 
    padding: 12px; 
    border-radius: 10px; 
    margin-bottom: 10px; 
  }
  .msg-time { 
    font-size: 11px; 
    color: #888; 
    text-align: right; 
    margin-top: 5px; 
  }
  .last-withdrawal {
    background: #2a2a1a;
    border: 1px solid #666;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
  }
  .warning {
    background: #3d1a1a;
    color: #ff8888;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

  <div class="input-box">
    <input type="tel" id="phoneInput" placeholder="Enter phone number" value="4444">
    <button onclick="loadMessages()">Load Messages</button>
  </div>
  
  <div id="lastWithdrawal"></div>
  <div id="messages">Enter a phone number and click Load.</div>

<script>
const API = "https://message-server-five.vercel.app";

async function loadMessages() {
  const phone = document.getElementById('phoneInput').value.trim();
  const messagesContainer = document.getElementById('messages');
  const lastContainer = document.getElementById('lastWithdrawal');
  
  if (!phone) return alert("Please enter a phone number");

  messagesContainer.innerHTML = "Loading...";
  lastContainer.innerHTML = "";

  try {
    // Fetch messages
    let res = await fetch(`${API}/api/messages/${phone}`);
    let data = await res.json();
    let messages = [];

    if (data.success && data.messages) {
      messages = data.messages;
    } else {
      // Fallback
      res = await fetch(`${API}/transactions`);
      let txData = await res.json();
      messages = txData.filter(tx => tx.phone === phone || 
                                   (tx.phone && tx.phone.includes(phone.slice(-9))));
    }

    // === Find Last Withdrawal ===
    const withdrawals = messages.filter(msg => 
      msg.message && msg.message.toLowerCase().includes("withdrawal request")
    );

    if (withdrawals.length > 0) {
      const last = withdrawals[0]; // Most recent first (assuming newest first)
      const lastTime = new Date(last.created_at || Date.now());
      const isToday = lastTime.toDateString() === new Date().toDateString();

      lastContainer.innerHTML = `
        <div class="last-withdrawal">
          <strong>Last Withdrawal Request:</strong><br>
          ${last.message}<br>
          <small>${lastTime.toLocaleString()}</small>
          ${isToday ? '<span class="warning">⚠️ Already submitted today (1 per day limit)</span>' : ''}
        </div>`;
    } else {
      lastContainer.innerHTML = `<div class="last-withdrawal">No previous withdrawal requests found.</div>`;
    }

    // Display all messages
    if (messages.length === 0) {
      messagesContainer.innerHTML = "No messages found for this number.";
      return;
    }

    messagesContainer.innerHTML = messages.map(tx => {
      let timeMatch = tx.message ? tx.message.match(/at (\d{1,2}:\d{2} (?:AM|PM))/i) : null;
      let timeStr = timeMatch ? timeMatch[1] : 
                    (tx.created_at ? new Date(tx.created_at).toLocaleString() : new Date().toLocaleString());
      
      return `
        <div class="msg-box">
          <div>${tx.message || tx.text || JSON.stringify(tx)}</div>
          <div class="msg-time">${timeStr}</div>
        </div>`;
    }).join('');
    
  } catch (err) {
    console.error(err);
    messagesContainer.innerHTML = "Error loading messages.";
  }
}

// Auto load for phone 4444 when page opens
window.onload = () => {
  loadMessages();
};
</script>
</body>
</html>
